# Fault-injection override. Use: docker compose -f docker-compose.yml -f docker-compose.fault.yml ...
# claims-service reaches Kafka through Toxiproxy (kafka:9094 is a third listener that advertises the proxy's
# address, so the producer's metadata keeps it on the proxy). insights-service is left on the direct listener.
services:
  kafka:
    environment:
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093,PROXIED://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092,PROXIED://toxiproxy:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,PROXIED:PLAINTEXT

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    restart: unless-stopped
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "127.0.0.1:18474:8474"

  claims-service:
    depends_on:
      toxiproxy:
        condition: service_started
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: toxiproxy:29094
