server {
  listen 80;
  root /usr/share/nginx/html;
  # 11m, not 10m: the API enforces the 10 MB file limit and answers with its own problem+json 413.
  # A smaller nginx limit would trip first on multipart overhead and return nginx's HTML page.
  client_max_body_size 11m;

  # Docker DNS, resolved per request. nginx must still start, and claimant
  # pages must still work, while an upstream is stopped.
  resolver 127.0.0.11 valid=5s ipv6=off;
  # For up to 5s after an upstream stops, nginx can still hold its old address, and connecting to it hangs.
  # Fail fast with 504 so the UI can say the service is down, instead of waiting out the 60s default.
  # This limits connecting only, not long uploads or downloads.
  proxy_connect_timeout 2s;
  set $claims   http://claims-service:8080;
  set $insights http://insights-service:8080;

  # Security headers. add_header in a location replaces (does not add to) the ones inherited from here, so
  # no location below sets its own: all three (static files, both API proxies) inherit exactly this set.
  # 'always' puts them on 4xx/5xx and nginx's own error pages too.
  #  - script-src 'self': no inline script and no third-party script. The Angular build is configured not to
  #    emit one (angular.json: inlineCritical false).
  #  - style-src 'unsafe-inline': Angular adds each component's CSS to the page as a <style> element at run
  #    time, and the CDK overlay sets style attributes. Both are inline style. Dropping it needs a per-request
  #    nonce (ngCspNonce), which a static nginx cannot give. Scripts stay strict.
  #  - img-src data: is the inline favicon (<link rel="icon" href="data:,">).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location /api/v1/insights/ {
    proxy_pass $insights;
    # The API sets some of these itself (Spring Security sends nosniff): drop its copy so a response carries one.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/ {
    proxy_pass $claims;
    # The API sets some of these itself (Spring Security sends nosniff): drop its copy so a response carries one.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
